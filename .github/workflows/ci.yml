name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (tsc + vite)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Build (tsc + vite)
        run: npm run build

  docker-build:
    name: docker build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build da imagem (sem push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: service-portal-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test da imagem
        run: |
          docker run -d --name fe -p 8080:80 -e BFF_URL=http://localhost:8081 service-portal-frontend:ci
          for i in $(seq 1 15); do
            curl -fsS http://localhost:8080/ >/dev/null && ok=1 && break
            sleep 1
          done
          docker logs fe
          [ "${ok:-}" = 1 ]

  test:
    name: testes com gate de cobertura
    needs: [build, docker-build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Testes com gate de cobertura
        run: npm run coverage

  agents-index:
    name: índice AGENTS.md
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: repo-index.py check
        run: python3 .claude/skills/update-agents-index/repo-index.py check .

  open-pr:
    name: abrir PR para main
    needs: [test, agents-index]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feature/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BRANCH: ${{ github.ref_name }}
      COMMIT_MSG: ${{ github.event.head_commit.message }}
    steps:
      - name: Abrir PR para main, se ainda não existir
        run: |
          existing=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq 'length')
          if [ "$existing" != "0" ]; then
            echo "PR já aberto para $BRANCH."
            exit 0
          fi
          title=$(printf '%s' "$COMMIT_MSG" | head -n 1)
          {
            printf '%s\n\n' "PR aberto automaticamente pelo CI depois de build e testes verdes em \`$BRANCH\`."
            printf '%s\n\n' "Último commit:"
            printf '%s\n' "$COMMIT_MSG"
          } > body.md
          if ! gh pr create --base main --head "$BRANCH" --title "$title" --body-file body.md; then
            echo "::warning::Não foi possível abrir o PR. Verifique em Settings > Actions > General se 'Allow GitHub Actions to create and approve pull requests' está habilitado."
          fi
